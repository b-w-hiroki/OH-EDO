name: capture-screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm install --no-save playwright@1.55.0
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium-webkit
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium webkit
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/oh-edo-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/oh-edo-preview.log
          exit 1
      - run: node scripts/capture-screenshots.mjs
      - name: Verify fair cast placement and foreground separation
        run: node scripts/full-character-art-qa.mjs
        env:
          OH_EDO_URL: http://127.0.0.1:4173
          OH_EDO_ART_QA_OUTPUT: qa-artifacts/foreground-separation
      - run: node scripts/release-qa.mjs
      - run: node scripts/local-perf-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-ui-screenshots
          path: |
            screenshots/
            qa-artifacts/
          retention-days: 7
